name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, types, secrets, deny-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - name: Deny-listed terms
        run: uv run python scripts/check_denylist.py
        env:
          FORGEGRAPH_DENYLIST: ${{ secrets.DENYLIST }}
          FORGEGRAPH_DENYLIST_REQUIRED: "1"
      - name: Secrets (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  tests-linux:
    name: Tests (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0  # for Forgemark, in the catalog's comment round trip
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing
        env:
          FORGEGRAPH_REQUIRE_NODE: "1"

  tests-other-os:
    # macOS and Windows minutes count heavily against a private repo's quota,
    # so these run only on main and on demand.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Tests (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
