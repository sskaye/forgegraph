name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    # A pull request that changes only pages no test reads skips the tests and packaging: review/,
    # docs/ but for the spec and pack pages the tests compare with their files, CHANGELOG.md and
    # CONTRIBUTING.md. The first job still checks them for secrets and deny-listed terms.
    name: Code changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          code=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then code=true; fi
          # a pull request is checked out as its merge commit, whose first parent is the base
          while read -r file; do
            case "$file" in
              docs/specifications/*|docs/packs/*) code=true ;;
              review/*|docs/*|CHANGELOG.md|CONTRIBUTING.md) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Lint, types, secrets, deny-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - name: Deny-listed terms
        # Dependabot's runs don't get the repository's secrets, and it changes only the lock file
        # and the actions' versions.
        if: github.actor != 'dependabot[bot]'
        run: uv run python scripts/check_denylist.py
        env:
          FORGEGRAPH_DENYLIST: ${{ secrets.DENYLIST }}
          FORGEGRAPH_DENYLIST_REQUIRED: "1"
      - name: Secrets (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  tests-linux:
    name: Tests (Linux, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0  # for Forgemark, in the catalog's comment round trip
        with:
          node-version: "22"
      - run: uv sync --locked
      # Coverage runs once, on 3.14, where it's cheap (coverage.py's sys.monitoring core).
      - if: matrix.python == '3.14'
        run: uv run pytest --full --ignore=tests/test_perturbation.py --cov --cov-report=term-missing --durations=15
        env:
          FORGEGRAPH_REQUIRE_NODE: "1"
      - if: matrix.python != '3.14'
        run: uv run pytest --full --ignore=tests/test_perturbation.py --durations=15
        env:
          FORGEGRAPH_REQUIRE_NODE: "1"

  tests-perturbation:
    # Most of the full suite's time, in a job of its own so it runs beside the others. Whether a
    # parameter changes the drawing doesn't depend on the Python version or operating system.
    name: Tests (every parameter changes the drawing)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest --full tests/test_perturbation.py --durations=15

  tests-lowest:
    name: Tests (lowest dependency versions)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      # every direct dependency at the lowest version pyproject allows
      - run: uv venv && uv pip install --resolution lowest-direct -e . --group dev
      - run: .venv/bin/python -m pytest

  tests-other-os:
    name: Tests (${{ matrix.os }}, Python 3.12)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # the perturbation tests have a job of their own
      - run: uv run pytest --full --ignore=tests/test_perturbation.py --durations=15

  package:
    # The wheel as a user gets it from pip, installed fresh and tried from outside the repo.
    name: Package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv build --out-dir dist
      - run: uvx --from "twine>=6.2" twine check dist/*
      - run: uv venv --python 3.12 "$RUNNER_TEMP/clean"
      - run: uv pip install --python "$RUNNER_TEMP/clean" dist/*.whl
      - name: Smoke test, outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          if [ -d "$RUNNER_TEMP/clean/Scripts" ]; then bin="$RUNNER_TEMP/clean/Scripts"; else bin="$RUNNER_TEMP/clean/bin"; fi
          PATH="$bin:$PATH" "$bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
