repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: \.md$|^(review|catalog|docs/visual-changelog)/
      - id: trailing-whitespace
        exclude: \.md$|^(review|catalog|docs/visual-changelog)/
      - id: check-added-large-files
        args: [--maxkb=600]
        exclude: ^(review|catalog|docs/visual-changelog)/  # self-contained HTML pages embed images
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: denylist
        name: deny-listed terms
        entry: python scripts/check_denylist.py
        language: python
        types: [text]
