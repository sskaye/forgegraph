name: economy_toggles
version: 0
description: The savings rate and the median length of unemployment by month, each series and the savings rate's mean shown or hidden on the HTML page.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: Savings and unemployment
    data:
        file: economics.parquet
        preprocessing: examples/sample-data/economics.csv, with its dates read as dates
    axis:
        x:
            data:
                column: date
            title: None
        y:
            title: None
    series:
        Savings rate (%):
            column: psavert
            marker:
                show: false
        Unemployment (weeks):
            column: uempmed
            marker:
                show: false
    legend:
        method: key
        key:
            positions: [top_left]
            inside: false
            title:
                text: None
    layers:
        mean:
            type: reference
            axis: y
            line_1:
                value: psavert
                aggregation:
                    function: mean
                label:
                    text: aggregation_value
                    position: end_above
                    inside: false
        show:
            type: toggle
            items: [series, mean]
            hidden: [mean]
