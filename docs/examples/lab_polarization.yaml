name: lab_polarization
version: 0
description: The polarization curves in the lab pack's theme and poster format.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: lab/lab_theme
        format: lab/poster
    text:
        title: Polarization curves
    data:
        file: cell_polarization.parquet
        preprocessing: examples/sample-data/cell_polarization.csv, unchanged
    axis:
        x:
            data:
                column: current_density_a_cm2
            title: Current density (A/cm^2)
        y:
            title: Voltage (V)
    series:
        voltage_v:
            color: cell
