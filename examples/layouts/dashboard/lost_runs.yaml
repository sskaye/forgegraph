name: lost_runs
version: 0
description: The share of each instrument's runs that failed or were aborted.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: Failed or aborted runs
    data:
        file: lost_runs.parquet
        preprocessing: prep_lab_dashboard.py (lab_runs.xlsx, Runs sheet; Status normalized; in-progress runs left out)
    axis:
        x:
            data:
                column: Instrument
            title: None
            tick:
                algorithm: all
    series:
        Failed or aborted (%):
            line:
                show: false
            marker:
                show: false
            bar:
                show: true
            value_label:
                show: true
                format: ".1f"
