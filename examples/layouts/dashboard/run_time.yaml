name: run_time
version: 0
description: Median time from start to finish of each instrument's completed runs.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: Run time
    data:
        file: run_time.parquet
        preprocessing: prep_lab_dashboard.py (lab_runs.xlsx, Runs sheet; Status normalized; in-progress runs left out)
    axis:
        x:
            data:
                column: Instrument
            title: None
            tick:
                algorithm: all
    series:
        Median run time (h):
            line:
                show: false
            marker:
                show: false
            bar:
                show: true
            value_label:
                show: true
                format: ".2f"
