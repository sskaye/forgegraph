name: runs_hplc_01
version: 0
description: Completed runs per week on HPLC-01.
extends: None
fixed_parameters: None
variable_parameters:
    specifications:
        graph_type: xy
        theme: forgegraph_base/base_theme
        format: forgegraph_base/base_format
    text:
        title: HPLC-01
    data:
        file: weekly_hplc_01.parquet
        preprocessing: prep_lab_dashboard.py (lab_runs.xlsx, Runs sheet; Status normalized; in-progress runs left out)
    axis:
        x:
            data:
                column: Week
            title: Week starting
        y:
            data:
                column: Completed runs
            min: 0
    grid:
        show: true
