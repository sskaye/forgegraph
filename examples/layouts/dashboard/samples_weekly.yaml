name: samples_weekly
version: 0
description: Samples in completed runs per week, all instruments.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: Samples per week
    data:
        file: weekly_samples.parquet
        preprocessing: prep_lab_dashboard.py (lab_runs.xlsx, Runs sheet; Status normalized; in-progress runs left out)
    axis:
        x:
            data:
                column: Week
            title: Week starting
        y:
            title: Samples
            min: 0
    series:
        Samples: {}
