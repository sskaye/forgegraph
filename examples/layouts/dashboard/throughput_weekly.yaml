name: throughput_weekly
version: 0
description: Completed runs per week (Mon–Sun, by finish time) for each instrument.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: Completed runs per week
    data:
        file: weekly_runs.parquet
        preprocessing: prep_lab_dashboard.py (lab_runs.xlsx, Runs sheet; Status normalized; in-progress runs left out)
    axis:
        x:
            data:
                column: Week
            title: Week starting
        y:
            title: Runs
            min: 0
    series:
        Completed runs:
            color: Instrument
