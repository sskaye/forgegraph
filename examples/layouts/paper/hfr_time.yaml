name: hfr_time
version: 0
description: High-frequency resistance over the durability test.
extends: None
fixed_parameters: None
variable_parameters:
    specifications:
        graph_type: xy
        theme: forgegraph_base/base_theme
        format: forgegraph_base/base_format
    text:
        title: None
    data:
        file: cell_durability.parquet
        preprocessing: prep_cells.py (sample-data CSVs, unchanged)
    axis:
        x:
            data:
                column: hours
            title: Time (h)
        y:
            data:
                column: hfr_mohm_cm2
            title: HFR (mΩ·cm²)
    encoding:
        color:
            column: cell
    mark:
        marker:
            show: false
