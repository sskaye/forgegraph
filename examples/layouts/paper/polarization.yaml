name: polarization
version: 0
description: Polarization curves after the durability test.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: None
    data:
        file: cell_polarization.parquet
        preprocessing: prep_cells.py (sample-data CSVs, unchanged)
    axis:
        x:
            data:
                column: current_density_a_cm2
            title: Current density (A/cm²)
        y:
            title: Cell voltage (V)
    series:
        voltage_v:
            color: cell
