name: voltage_time
version: 0
description: Cell voltage at 1 A/cm² over the 200-hour durability test.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_base/base_theme
        format: forgegraph_base/base_format
    text:
        title: None
    data:
        file: cell_durability.parquet
        preprocessing: prep_cells.py (sample-data CSVs, unchanged)
    axis:
        x:
            data:
                column: hours
            title: Time (h)
        y:
            data:
                column: voltage_v
            title: Cell voltage (V)
    encoding:
        color:
            column: cell
    mark:
        marker:
            show: false
