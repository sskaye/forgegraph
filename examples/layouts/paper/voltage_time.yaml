name: voltage_time
version: 0
description: Cell voltage at 1 A/cm² over the 200-hour durability test.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: None
    data:
        file: cell_durability.parquet
        preprocessing: prep_cells.py (sample-data CSVs, unchanged)
    axis:
        x:
            data:
                column: hours
            title: Time (h)
        y:
            title: Cell voltage (V)
    series:
        voltage_v:
            color: cell
            marker:
                show: false
