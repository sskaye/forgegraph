name: slide          # [text]; The name of the format.
version: 0          # [int]; The version number of the specification.
description: A full-width graph on a 16:9 slide.          # [text]; The description of the format.
extends: forgegraph_base/base_format          # [None, format]; Each parameter not listed is inherited from this format. If None, this file must list every parameter.

fixed_parameters:          # List of fixed parameters for the format.
    figure:
        width: 254          # [auto, positive float]; Width, mm. auto: from height and plot_area.aspect. Not both auto.
        height: 143          # [auto, positive float]; Height, mm. auto: from width and plot_area.aspect.
        base_size: 20          # [positive float]; Base size, pt. Text, lines, ticks and gaps are multiples of it.

variable_parameters: None          # List of variable parameters for the format, None if none.
