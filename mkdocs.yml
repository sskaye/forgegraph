site_name: ForgeGraph
site_description: Fast, consistent, publication-quality graphs from pandas DataFrames, usable by people and AI agents.
site_url: https://sskaye.github.io/forgegraph/
repo_url: https://github.com/sskaye/forgegraph
repo_name: sskaye/forgegraph
edit_uri: ""
docs_dir: docs/site
strict: true

# The Reference's commands and specifications pages are generated from the CLI and the
# definition files as the site is built, and added to the Reference in the navigation; the
# guides' and gallery's graphs are drawn from docs/examples as it's built (hooks).
hooks:
  - scripts/docs_site.py

nav:
  - Get started:
      - Overview: index.md
      - Installation: get-started/installation.md
      - Quickstart: get-started/quickstart.md
      - The agent skill: get-started/skill.md
  - Guides:
      - Graphs: guides/graphs.md
      - Series: guides/series.md
      - Layers: guides/layers.md
      - Layouts and dashboards: guides/layouts.md
      - Themes, formats and packs: guides/themes-formats-packs.md
      - Configs: guides/configs.md
      - Schedules: guides/schedules.md
      - Provenance: guides/provenance.md
  - Gallery: gallery.md
  - Reference:
      - Python API: reference/python-api.md
  - Help:
      - Troubleshooting: help/troubleshooting.md
      - FAQ: help/faq.md
      - Changelog: help/changelog.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  # One light look, after TabPFN's documentation: black text and headings on white, navy links
  # (stylesheets/extra.css).
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: DM Sans
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # Pages include the example files and the CHANGELOG as they are; a missing one fails the build.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            docstring_style: google
            filters: ["!^_"]
