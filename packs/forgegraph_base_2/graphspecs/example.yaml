name: example          # [text]; The name of the GraphSpec.
version: 0          # [int]; The version number of the specification.
description: The base pack's example GraphSpec in this pack's theme and format, for its catalog.          # [text]; The description of the GraphSpec.
extends: forgegraph_base/polarization          # [None, graphspec]; Each parameter not listed is inherited from this GraphSpec. If None, this file must list every parameter.

fixed_parameters: None          # List of fixed parameters for the GraphSpec, None if none.

variable_parameters:          # List of variable parameters for the GraphSpec, None if none.
    specifications:
        theme: forgegraph_base_2/base_theme          # [theme];
        format: forgegraph_base_2/compact_format          # [format];
    data:
        file: polarization.parquet          # [None, text]; Parquet file holding the DataFrame to draw.
