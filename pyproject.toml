[project]
name = "forgegraph"
version = "0.2.0"
description = "Fast, consistent, publication-quality graphs from pandas DataFrames, usable by people and AI agents."
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/forgegraph/fonts/OFL-SourceSans3.md", "src/forgegraph/fonts/OFL-IBMPlexSerif.txt", "src/forgegraph/fonts/OFL-Roboto.txt"]
authors = [{ name = "Steven Kaye" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.11.2",  # text.py reads the line layout of 3.11 and later
    "pandas>=2.2",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "pyarrow>=17",
    "typer>=0.15.4",  # earlier versions allow a click whose help they can't show
    "packaging>=23",
]

[project.urls]
Repository = "https://github.com/sskaye/forgegraph"
Issues = "https://github.com/sskaye/forgegraph/issues"
Changelog = "https://github.com/sskaye/forgegraph/blob/main/CHANGELOG.md"

[project.scripts]
forgegraph = "forgegraph.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",  # tests run in parallel
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "openpyxl>=3.1",  # writes the Excel files in the eval and sample data
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgegraph"]

[tool.hatch.build.targets.sdist]
# The review pages, generated catalogs and visual changelogs belong to the repository, not the
# package.
exclude = ["/review", "/catalog", "/evals", "/.github", "/docs/visual-changelog"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", "review"]  # review pages and notebooks are generated

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies field defaults per instance, so mutable defaults are safe on models.
"src/forgegraph/spec/*.py" = ["RUF012"]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -n auto"  # -n 0 runs them one at a time
markers = ["slow: over a second, or drawing every catalog card; run only with --full"]

[tool.coverage.run]
source = ["forgegraph"]
