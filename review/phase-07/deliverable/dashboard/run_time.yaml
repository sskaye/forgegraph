name: run_time
version: 0
description: Median time from start to finish of each instrument's completed runs.
extends: None
fixed_parameters: None
variable_parameters:
    specifications:
        graph_type: xy
        theme: forgegraph_base/base_theme
        format: forgegraph_base/base_format
    text:
        title: Run time
    data:
        file: run_time.parquet
        preprocessing: prep_lab_dashboard.py (lab_runs.xlsx, Runs sheet; Status normalized; in-progress runs left out)
    axis:
        x:
            data:
                column: Instrument
            title: None
            tick:
                algorithm: all
        y:
            data:
                column: Median run time (h)
    mark:
        bar:
            show: true
        line:
            show: false
        marker:
            show: false
    series:
        value_label:
            show: true
            format: ".2f"
