name: lab_dashboard
version: 0
description: Lab throughput dashboard, rendered every weekday morning.
extends: forgegraph_base/base_schedule
fixed_parameters: None
variable_parameters:
    targets:
        files: [../../phase-07/deliverable/dashboard/lab_throughput.layout.yaml]
        output_folder: ~/Dashboards
    cadence:
        interval_unit: week
        at: [mon 06:00, tue 06:00, wed 06:00, thu 06:00, fri 06:00]
    on_failure:
        command: [osascript, -e, display notification "Lab dashboard failed" with title "ForgeGraph"]
