name: base_theme          # [text]; The name of the theme.
version: 0          # [int ≥ 0]; The version number of the specification.
description: The base theme that others can inherit from.          # [text]; The description of the theme.
extends: None          # [None, theme]; Each parameter not listed is inherited from this theme. If None, this file must list every parameter.

parameters: !fix          # !var/!fix sets whether a GraphSpec may change a property. Subcategories/parameters inherit the setting of the one above them unless explicitly overridden.
    font:
        family: Roboto          # [text]; Typeface for all text.
        color: "#000000"          # [hex color]; Text color, unless set elsewhere.
        weight: regular          # [light, regular, medium, semibold, bold]; Weight of text without its own: tick labels, value labels, notes, key names, footnotes.
    background:
        color: "#FFFFFF"          # [None, hex color]; Figure and plot background. None: transparent.
    title:
        size: 1.05          # [float > 0]; Title size, × base size.
        weight: semibold          # [light, regular, medium, semibold, bold]; Title weight.
        gap: 0.5          # [float > 0]; Gap below the title's letters, × base size.
    axis:
        title:
            size: 1.05          # [float > 0]; Axis title size, × base size.
            weight: semibold          # [light, regular, medium, semibold, bold]; Axis title weight.
            gap: 0.5          # [float > 0]; Gap from tick labels to the title's letters, × base size.
        tick:
            direction: out          # [in, out, both]; Tick direction.
            sides: [left, bottom]          # [left, right, top, bottom, None]; Sides with ticks. None: none.
            length: 0.3          # [float > 0]; Tick length, × base size.
            width: 0.07          # [float > 0]; Tick width, × base size.
            algorithm: extended_wilkinson          # [extended_wilkinson, wilkinson, heckbert, nelder, r_pretty, matplotlib]; Published algorithm placing major ticks on linear axes.
            log_algorithm: breaks_log          # [breaks_log, matplotlib]; Published algorithm placing major ticks on log axes. breaks_log: R's scales::breaks_log, as many labels as axis.tick.algorithm gives an axis of the same length. matplotlib: powers of ten only.
            label:
                size: 0.9          # [float > 0]; Tick label size, × base size.
                gap: 0.3          # [float > 0]; Gap from tick to label, × base size.
                x_rotation: 0          # [0-90]; x tick label angle, degrees. 0: horizontal.
                date_order: month_day          # [month_day, day_month]; Day and month in automatic date tick labels: Jul 6, or 6 Jul.
                max_wrap: 1          # [int ≥ 0]; Times an x tick label may wrap to fit beside its neighbors (not dates). 0: never.
            minor:
                count: 0          # [int ≥ 0]; Minor ticks between major ticks. 0: none.
                length: 0.15          # [float > 0]; Minor tick length, × base size.
                width: 0.05          # [float > 0]; Minor tick width, × base size.
    plot_area:
        sides: [left, bottom, top, right]          # [left, right, top, bottom, None]; Sides with a border line. None: none.
        line:
            width: 0.08          # [float > 0]; Border line width, × base size.
            color: "#000000"          # [hex color]; Border line color.
        aspect: 1.1          # [float > 0]; Plot area width ÷ height.
        margin: 0.05          # [0-1]; Gap between data and the plot area's edge, × the data's range.
    grid:
        color: "#E6E6E6"          # [hex color]; Grid color.
        line:
            width: 0.05          # [float > 0]; Grid line width, × base size.
            style: solid          # [solid, dashed, dotted]; Grid line style.
        show: !var false          # [true, false]; Draw a grid.
    series:
        colors: okabe_ito          # [okabe_ito, tol_bright, tol_muted, tableau_10, color_blind, hex colors]; Colors for encoding.color.column groups, in order, then repeating: a named palette, or a list of colors.
        line:
            style: [solid, dashed, dotted, dashdot]          # [solid, dashed, dotted, dashdot]; Line styles for encoding.line.style.column groups, in order.
            cap: projecting          # [butt, round, projecting]; Shape of a line's ends.
            join: round          # [miter, round, bevel]; Shape of a line's corners.
            width: !var 0.15          # [float > 0]; Line width, × base size.
        marker:
            shape: [circle, square, triangle_up, diamond, triangle_down, cross]          # [circle, square, triangle_up, triangle_down, diamond, cross, plus]; Marker shapes for encoding.marker.shape.column groups, in order.
            fill: [filled, open]          # [filled, open]; Marker fills for encoding.marker.fill.column groups, in order. open: outline only.
            edge:
                color: "#000000"          # [None, hex color]; Outline color of filled markers. None: none.
                width: !var 0.05          # [float > 0]; Marker outline width, × base size.
            size: !var 0.5          # [float > 0]; Marker size, × base size.
        bar:
            edge:
                color: "#000000"          # [None, hex color]; Bar outline color. None: none.
                width: !var 0.05          # [float > 0]; Bar outline width, × base size.
            width: !var 2.5          # [float > 0]; Bar width, × base size. Bars that would overlap are an error.
            gap: !var 0.15          # [0-2]; Gap between side-by-side bars, × base size.
        value_label:
            size: 0.9          # [float > 0]; Value label size, × base size.
            gap: 0.25          # [float > 0]; Gap from the mark to the label's letters, × base size.
        benchmark:
            color: "#808080"          # [hex color]; Benchmark color.
            marker:
                fill: filled          # [filled, open]; Benchmark marker fill.
                edge:
                    color: "#000000"          # [None, hex color]; Outline color of a filled benchmark marker. None: none.
                    width: !var 0.05          # [float > 0]; Benchmark marker outline width, × base size.
                shape: !var circle          # [circle, square, triangle_up, triangle_down, diamond, cross, plus]; Benchmark marker shape.
                size: !var 0.5          # [float > 0]; Benchmark marker size, × base size.
            bar:
                edge:
                    color: "#000000"          # [None, hex color]; Benchmark bar outline color. None: none.
                    width: !var 0.05          # [float > 0]; Benchmark bar outline width, × base size.
                width: !var 2.5          # [float > 0]; Benchmark bar width, × base size.
            line: !var
                style: solid          # [solid, dashed, dotted, dashdot]; Benchmark line style.
                width: 0.15          # [float > 0]; Benchmark line width, × base size.
    legend:
        methods: [auto, direct, key]          # [auto, direct, key, none]; Methods graphs may use to name series; auto tries direct and key, in this list's order, never none. direct: names beside the lines. key: a list of names, each with its line or marker.
        label:
            size: 1.0          # [float > 0]; Series name size, × base size.
            weight: semibold          # [light, regular, medium, semibold, bold]; Direct label weight; key names use font.weight.
        key:
            frame:
                show: false          # [true, false]; Box around the key.
                width: 0.06          # [float > 0]; Frame line width, × base size.
            background: None          # [None, hex color]; Fill behind the key. None: none.
            padding: 0.5          # [float > 0]; Gap inside the frame, every side, × base size.
            inset: 0.5          # [float > 0]; Gap from the plot area to the key, × base size.
            row_gap: 0.55          # [float > 0]; Gap between entries, × base size.
            title:
                weight: semibold          # [light, regular, medium, semibold, bold]; Key title weight.
                align: left          # [left, center, right]; Key title alignment.
                gap: 0.55          # [float > 0]; Gap from the title to the first entry, × base size.
            sample:
                length: 2.0          # [float > 0]; Line sample length, × base size.
                gap: 0.7          # [float > 0]; Gap from the line sample to the name, × base size.
                marker: !var
                    size: 0.5          # [float > 0]; Marker size in key samples, × base size; series.marker.size sets the plot's.
        color_bar:
            layout: title_above          # [title_above, title_along, below]; title_above: bar right of the plot, title above it. title_along: title beside the bar, reading down. below: horizontal bar under the plot.
            width: 0.7          # [float > 0]; Bar thickness, × base size.
            gap: 0.8          # [float > 0]; Gap from the plot area to the bar, × base size.
            colors: !var viridis          # [viridis, cividis, plasma, inferno, magma, greys, blues, red_blue, hex color, two hex colors]; Colors for a numeric encoding.color.column: a named scale, one hex color (light to it) or two (first to second).
        direct: !var
            clearance: 0.2          # [float > 0]; Minimum gap around a direct label, × base size.
            max_relative_distance: 0.8          # [0-1]; Most a label's distance to its series may be, ÷ its distance to the next nearest.
            max_axis_extension: 0.15          # [0-1]; Most the x-axis may grow to fit labels, × its range.
    layer:
        error_bar:
            cap:
                width: 0.25          # [float > 0]; Cap width, × base size.
            line:
                width: 0.08          # [float > 0]; Line width, × base size.
            color: !var "#000000"          # [series, hex color]; Error bar color. series: the series' color.
        reference_line:
            color: "#808080"          # [hex color]; Line and label color, unless drawn per series.
            line:
                style: dashed          # [solid, dashed, dotted, dashdot]; Line style.
                width: 0.08          # [float > 0]; Line width, × base size.
            label:
                size: 0.8          # [float > 0]; Label size, × base size.
                gap: 0.25          # [float > 0]; Gap from the line to the label's letters, × base size.
        note:
            size: 0.8          # [float > 0]; Note size, × base size.
            color: "#404040"          # [hex color]; Note color.
            inset: 0.5          # [float > 0]; Gap between the plot area's edges and the note, × base size.
    watermark:
        text: NON-STANDARD          # [text]; Watermark on non-standard graphs.
        color: "#CC0000"          # [hex color]; Watermark color.
        opacity: 0.18          # [0-1]; Watermark opacity.
        weight: bold          # [light, regular, medium, semibold, bold]; Watermark weight.
        angle: 30          # [-90-90]; Watermark angle, degrees counterclockwise.
        span: 0.8          # [0-1]; Share of the plot area's width or height it spans, whichever it reaches first.
    footnote:
        size: 0.7          # [float > 0]; Size of footnotes below the figure, × base size.
        color: "#808080"          # [hex color]; Footnote color.
        gap: 0.5          # [float > 0]; Gap from the lowest text or line above a footnote to its letters, × base size.
