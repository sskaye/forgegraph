name: bars
version: 0
description: Each cell's peak power density as a bar, with its value.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: Peak power density
    data:
        file: xy.parquet
        preprocessing: None
    axis:
        x:
            data:
                column: Cell
            tick:
                algorithm: all
    series:
        Power Density (mW/cm²):
            aggregation:
                function: max
            line:
                show: false
            marker:
                show: false
            bar:
                show: true
            value_label:
                show: true
