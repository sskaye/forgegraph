name: controls
version: 0
description: The mean of each cell's runs, with a linear or log current axis chosen on the HTML page, and the series, error bars and target line shown or hidden there.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: Polarization
    data:
        file: xy.parquet
        preprocessing: None
    axis:
        x:
            data:
                column: Cell Current (mA/cm²)
    series:
        Cell Voltage (V):
            aggregation:
                function: mean
            color: Cell
    output:
        file_types: [png, html]
    layers:
        Error bars:
            type: error_bar
        Target:
            type: reference
            axis: y
            line_1:
                value: 1.2
                label:
                    text: Target 1.2 V
        scale:
            type: choice
            label: Current axis
            views:
                Linear: {}
                Log: {axis.x.scale: log}
        show:
            type: toggle
            label: Show
            items: [series, layers]
            hidden: [Error bars]
