name: figure
version: 0
description: The example layout, rendered every weekday at 06:00.
extends: forgegraph_default/schedule

parameters:          # !var: a schedule that extends it may change it; !fix: it may not; on a category, all in it. Each parameter is tagged here or in the schedule it extends.
    targets:
        files: [figure.layout.yaml]
    cadence:
        interval:
            unit: week
        at: [mon 06:00, tue 06:00, wed 06:00, thu 06:00, fri 06:00]
