name: figure
version: 0
description: The example layout, rendered every weekday at 06:00.
extends: forgegraph_base/base_schedule
fixed_parameters: None
variable_parameters:
    targets:
        files: [figure.layout.yaml]
    cadence:
        interval:
            unit: week
        at: [mon 06:00, tue 06:00, wed 06:00, thu 06:00, fri 06:00]
