name: layers
version: 0
description: Polarization curves, the mean of each cell's runs with ±1 standard deviation, a target line and the test conditions.
extends: None
parameters: !var
    specifications:
        graph_type: xy
        theme: forgegraph_default/light_theme
        format: forgegraph_default/compact_format
    text:
        title: Polarization
    data:
        file: xy.parquet
        preprocessing: None
    axis:
        x:
            data:
                column: Cell Current (mA/cm²)
    series:
        Cell Voltage (V):
            aggregation:
                function: mean
            color: Cell
    layers:
        spread:
            type: error_bar
        target:
            type: reference
            axis: y
            line_1:
                value: 1.2
                label:
                    text: Target 1.2 V
        conditions:
            type: note
            text: "60 °C, 1 atm, H_{2}/air"
